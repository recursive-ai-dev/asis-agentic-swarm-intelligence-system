[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asis-swarm"
dynamic = ["version"]
description = "A deterministic team of single-purpose agents that plans against a knowledge base: goals and constraints in, the cheapest satisfying plan (or a precise account of why none exists) out."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
dependencies = []
keywords = ["multi-agent", "swarm", "planning", "constraint-satisfaction", "symbolic", "rule-engine"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1"]

[project.scripts]
asis = "asis:main"

[project.urls]
Repository = "https://github.com/recursive-ai-dev/asis-agentic-swarm-intelligence-system"

[tool.setuptools]
packages = ["asis"]

[tool.setuptools.package-data]
asis = ["dashboard.html", "domains/*.json"]

[tool.setuptools.dynamic]
version = { attr = "asis.core.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
