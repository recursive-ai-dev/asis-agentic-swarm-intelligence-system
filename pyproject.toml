[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "asis-swarm"
dynamic = ["version"]
description = "Algebraic Swarm Intelligence System: a deterministic multi-agent engine built on a symbolic algebra of concepts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.10"
dependencies = []
keywords = ["multi-agent", "swarm", "symbolic", "rule-engine", "simulation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "build>=1"]

[project.scripts]
asis = "asis:main"

[project.urls]
Repository = "https://github.com/recursive-ai-dev/asis-agentic-swarm-intelligence-system"

[tool.setuptools]
packages = ["asis"]

[tool.setuptools.package-data]
asis = ["dashboard.html"]

[tool.setuptools.dynamic]
version = { attr = "asis.core.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
